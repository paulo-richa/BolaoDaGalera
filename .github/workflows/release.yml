name: Release

# main only moves via a release/x.y.z -> main pull request (enforced by
# branch protection + the require-release-source job below), opened by
# promote-main.yml once a release branch has been validated on Firebase App
# Distribution and published to the Play Store.
#
# The validation jobs below only run on `push` (i.e. after the PR merges) -
# not on `pull_request`. That's not a gap: release-candidate.yml already ran
# the identical set of checks (same job names) against this exact commit SHA
# when it was pushed to release/x.y.z, and GitHub's required status checks
# match by SHA + context name regardless of which workflow posted them, so
# they're already satisfied by the time the PR opens. Re-running them here
# too would just burn CI minutes validating a commit that hasn't changed.
# This assumes every release/x.y.z branch reaches main only through the
# normal flow (push -> release-candidate.yml -> promote-main.yml); a PR
# opened from a release branch that skipped that flow would have no
# pre-existing checks and could get stuck waiting.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  require-release-source:
    name: Require PR from a release branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          case "${{ github.head_ref }}" in
            release/*) ;;
            *)
              echo "::error::main only accepts pull requests from a release/x.y.z branch (got '${{ github.head_ref }}')."
              exit 1
              ;;
          esac

  static-analysis:
    name: ktlint + detekt + Android Lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt detektDesignSystem

      - name: Android Lint
        run: ./gradlew :composeApp:lintDebug

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/ktlint/
            composeApp/build/reports/lint-results-debug.html
          retention-days: 14

  unit-tests:
    name: Unit tests + coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Generate coverage report (Kover)
        run: ./gradlew koverXmlReportDebug koverHtmlReportDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/build/test-results/**/*.xml"
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/build/reports/kover/"
          retention-days: 14

  build-release:
    name: Build signed release APK
    if: github.event_name == 'push'
    needs: [static-analysis, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Assemble release
        run: ./gradlew :composeApp:assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: composeApp/build/outputs/apk/release/*.apk
          retention-days: 30

  instrumented-tests:
    name: Instrumented tests (emulator)
    if: github.event_name == 'push'
    needs: [static-analysis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: ./gradlew :composeApp:connectedDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: composeApp/build/outputs/androidTest-results/
          retention-days: 14

  codeql:
    name: CodeQL
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Build for analysis
        # --rerun-tasks forces javac/kotlinc to actually run instead of reporting
        # UP-TO-DATE from Gradle's build cache - CodeQL's tracer only sees code that
        # gets compiled during this step, otherwise it fails with "no source code seen".
        run: ./gradlew :composeApp:assembleDebug --rerun-tasks

      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: Gitleaks (secret scanning)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-firebase:
    name: Deploy to Firebase App Distribution
    # Only after a real merge to main - never while a PR is just being validated.
    if: github.event_name == 'push'
    needs: [build-release, instrumented-tests, codeql, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write Firebase service account
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: composeApp/build/outputs/apk/release/

      - name: Upload to testers
        run: ./gradlew :composeApp:appDistributionUploadRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_DISTRIBUTION_TESTERS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_TESTERS }}
