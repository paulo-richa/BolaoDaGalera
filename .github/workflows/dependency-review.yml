name: Dependency Review

# Dependency Review only works on pull_request events (it diffs the dependency
# graph between base and head), so it can't live in the push-triggered ci.yml.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
