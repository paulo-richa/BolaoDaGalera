name: Sync Scores (Brasileirão + Libertadores)

# Agendamento (repo público = minutos ilimitados no GitHub Actions):
#   - 4x/dia fixo: 02h, 09h, 14h, 18h (horário de Brasília, UTC-3)
#   - A cada 5 min: verifica se há jogo LIVE ou próximo do horário
#     (30 min antes até 30 min depois do início). Se sim, faz um loop
#     interno chamando o sync a cada ~60s até o próximo disparo do cron,
#     simulando sincronização "a cada 1 minuto" durante jogos.
# Reativação do agendamento após suspensão por inatividade (2026-08-30).
on:
  schedule:
    - cron: "0 5,12,17,21 * * *"  # 02h,09h,14h,18h BRT -> 05h,12h,17h,21h UTC
    - cron: "*/5 * * * *"          # checagem de jogos ao vivo/próximos
  workflow_dispatch: {}             # permite disparo manual pela aba Actions

jobs:
  fixed-daily-sync:
    if: github.event.schedule == '0 5,12,17,21 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync Brasileirão
        run: curl -sf --max-time 60 "https://us-central1-bolaodagalera-bb002.cloudfunctions.net/syncBrasileiraoHTTP" || true
      - name: Sync Libertadores
        run: curl -sf --max-time 60 "https://synclibertadoreshttp-rqpmdmyp6a-uc.a.run.app" || true

  live-check-and-sync:
    if: github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verifica se há jogo ao vivo ou próximo do início
        id: check
        run: |
          RESPONSE=$(curl -sf --max-time 30 "https://us-central1-bolaodagalera-bb002.cloudfunctions.net/checkSyncFrequency" || echo '{"shouldSyncFrequently":false}')
          echo "response=$RESPONSE"
          SHOULD_SYNC=$(echo "$RESPONSE" | grep -o '"shouldSyncFrequently":true' || true)
          if [ -n "$SHOULD_SYNC" ]; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sincroniza a cada ~60s até o próximo cron (apenas se necessário)
        if: steps.check.outputs.sync == 'true'
        run: |
          # Faz até 4 rodadas de sync (~60s cada), cobrindo os 5 min até o próximo disparo
          for i in 1 2 3 4; do
            echo "Rodada $i de sincronização"
            curl -sf --max-time 30 "https://us-central1-bolaodagalera-bb002.cloudfunctions.net/syncBrasileiraoHTTP" || true
            curl -sf --max-time 30 "https://synclibertadoreshttp-rqpmdmyp6a-uc.a.run.app" || true
            if [ "$i" -lt 4 ]; then
              sleep 60
            fi
          done
