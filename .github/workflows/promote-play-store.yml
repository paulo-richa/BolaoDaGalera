name: Promote to Play Store

# Manually triggered from a release/x.y.z branch (pick it as the "Use
# workflow from" branch when dispatching) once its Firebase App
# Distribution build has been validated. versionName is derived from the
# branch name; versionCode is auto-assigned by Gradle Play Publisher based
# on the current max on the Play Console - neither is hardcoded here.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: Build AAB and publish to Play Store
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Extract version name from branch
        id: version
        run: echo "name=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Decode Play service account
        run: echo "$PLAY_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/play-service-account.json"
        env:
          PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_BASE64 }}

      - name: Publish bundle to Play Store (closed testing - Alpha)
        run: ./gradlew :composeApp:publishReleaseBundle -PversionNameOverride=${{ steps.version.outputs.name }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/play-service-account.json
          PLAY_TRACK: ${{ secrets.PLAY_TRACK }}
