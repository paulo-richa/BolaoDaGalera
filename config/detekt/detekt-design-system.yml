# Config isolada pra regra "sem string hardcoded em componente Bolao*".
# Desativa todos os rulesets padrão do detekt (já cobertos pelo
# config/detekt/detekt.yml principal) pra rodar só essa checagem, sem
# misturar com o restante das regras de estilo/complexidade.
build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  active: false

style:
  active: false

naming:
  active: false

potential-bugs:
  active: false

performance:
  active: false

# Theme/Color/Typography hold the raw values *defining* the design system's own
# tokens - the rest of the codebase is supposed to reference these instead of
# repeating raw values, so the raw-value rules don't apply to their own source.
bolao-design-system:
  active: true
  NoHardcodedStringInDesignSystem:
    active: true
  NoRawFontSize:
    active: true
    excludes:
      - '**/theme/Typography.kt'
  NoRawCornerRadius:
    active: true
    excludes:
      - '**/theme/Theme.kt'
  NoRawSpacingDp:
    active: true
    excludes:
      - '**/theme/Theme.kt'
  NoRawElevation:
    active: true
    excludes:
      - '**/theme/Theme.kt'
