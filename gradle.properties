#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Temporary opt-out (AGP itself suggests this exact pair when it detects
# com.android.library + org.jetbrains.kotlin.multiplatform in the same module,
# which composeApp and the other 7 KMP library modules still do): lets them
# keep working without migrating to com.android.kotlin.multiplatform.library
# right now - that plugin migration is a separate, later effort.
android.builtInKotlin=false
android.newDsl=false
# R8 full mode crashes WorkManager (transitive via Firebase) at process start under the release
# build - "Failed to create an instance of androidx.work.impl.WorkDatabase" from
# androidx.startup.InitializationProvider, before Application.onCreate even runs. Full mode's more
# aggressive optimizations (beyond legacy ProGuard-compatible behavior) are the known common cause
# for exactly this failure pattern in reflection-heavy libraries like Room/WorkManager. Compat mode
# trades a bit of shrinking for correctness here.
android.enableR8.fullMode=false

#iOS
kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true
