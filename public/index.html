<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão da Galera - Copa 2026</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0B1019;
            color: #FFFFFF;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .hero {
            padding: 40px 20px;
        }
        .logo {
            width: 180px;
            height: 180px;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 178, 0.3));
        }
        h1 {
            font-size: 2.5em;
            margin: 10px 0;
            background: linear-gradient(90deg, #00FFB2, #00D1FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #B0BCC7;
            font-size: 1.2em;
            max-width: 600px;
            margin: 20px auto;
        }
        .btn {
            background: linear-gradient(135deg, #00FFB2 0%, #00D1FF 100%);
            color: #0B1019;
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
            margin-top: 30px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 178, 0.4);
        }
        .links {
            margin-top: 60px;
        }
        .links a {
            color: #5B6B79;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.9em;
        }
        .links a:hover {
            color: #00FFB2;
        }
        .code-box {
            display: none;
            margin: 30px auto 0;
            padding: 16px 24px;
            border: 1px solid #2A3542;
            border-radius: 16px;
            max-width: 320px;
        }
        .code-box p {
            margin: 0 0 8px;
            font-size: 0.95em;
        }
        .code-value {
            font-size: 1.8em;
            font-weight: bold;
            letter-spacing: 0.1em;
            color: #00FFB2;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #00D1FF;
            color: #00D1FF;
            margin-left: 12px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <!-- O logo será carregado via caminho relativo do repositório -->
        <img src="assets/logo.png" alt="Bolão da Galera" class="logo">
        <h1>Bolão da Galera</h1>
        <p>A forma mais épica de organizar seus palpites para a Copa 2026 com seus amigos.</p>

        <div>
            <a id="playStoreBtn" href="https://play.google.com/store/apps/details?id=com.lpstudio.bolaodagalera" class="btn">Baixar na Google Play</a>
            <a id="openAppBtn" href="#" class="btn btn-secondary" style="display: none;">Abrir no app</a>
        </div>

        <!-- Se o navegador não conseguir abrir o app direto pelo link (App Link não
             verificado, ou clique veio de dentro de um webview do WhatsApp/Instagram
             que ignora App Links), o código do convite fica visível aqui como rede de
             segurança - sem isso, quem instala o app depois de clicar no link perdia o
             código, já que não há deep link diferido (Play Install Referrer/Dynamic
             Links) implementado neste projeto. -->
        <div id="codeBox" class="code-box">
            <p>Depois de instalar, abra o app e entre com o código:</p>
            <div class="code-value" id="codeValue"></div>
        </div>

        <div class="links">
            <a href="privacy-policy">Política de Privacidade</a>
            <a href="mailto:richa.lpstudio@gmail.com">Suporte</a>
        </div>
    </div>

    <script>
        const code = new URLSearchParams(window.location.search).get("code");
        if (code) {
            document.getElementById("codeValue").textContent = code;
            document.getElementById("codeBox").style.display = "block";

            const openAppBtn = document.getElementById("openAppBtn");
            openAppBtn.href = "bolaodagalera://invite?code=" + encodeURIComponent(code);
            openAppBtn.style.display = "inline-block";
        }
    </script>
</body>
</html>
